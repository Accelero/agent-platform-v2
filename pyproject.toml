[project]
name = "agent-platform"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "jsonschema==4.26.0",
    "kubernetes==37.0.2",
    "openapi-spec-validator==0.9.0",
    "playwright==1.65.1",
    "pytest==9.2.0",
    "requests==2.34.2",
    "ruff==0.17.5",
    "urllib3==2.8.0",
    "websocket-client==1.9.2",
]

[tool.pytest.ini_options]
testpaths = [
    "agent_platform/tests",
    "charts/tests",
    "contracts/hermes-manager/tests",
    "runtimes/hermes/tests",
    "tests",
]
pythonpath = ["."]
# A plain run needs no infrastructure and no Rust or Node toolchain; select
# more with -m, for example `-m unit`, `-m "manager and integration"`, `-m e2e`.
addopts = "--strict-config --strict-markers --import-mode=importlib -m 'not (cluster or database or image or browser or destructive or multi_node or soak or rust or node)'"
markers = [
    "unit: no external service or cluster",
    "integration: a real dependency, image or process boundary",
    "e2e: the Helm-installed system",
    "manager: the manager API, controller and their contracts",
    "gateway: hermes-proxy, hermes-gateway and gateway TLS",
    "dashboard: the React dashboard",
    "hermes: what the project adds to the Hermes image",
    "worker: the agent-runtime worker image",
    "chart: the Helm chart",
    "tooling: agent_platform and the test harness",
    "rust: runs cargo test",
    "node: runs the dashboard's npm scripts",
    "cluster: requires a disposable cluster",
    "database: requires a disposable PostgreSQL fixture",
    "image: requires a built runtime image",
    "browser: requires a real browser",
    "security: verifies an authorization or isolation boundary",
    "destructive: requires exclusive disposable infrastructure",
    "multi_node: requires multiple cluster nodes",
    "slow: longer bounded verification",
    "soak: explicitly budgeted stability profile",
]

[tool.ruff]
# The Hermes image's own sources follow the upstream code they patch.
extend-exclude = ["runtimes/hermes/*.py", "runtimes/hermes/plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.per-file-target-version]
"runtimes/**/*.py" = "py313"
