# SSH sessions receive only this image's public defaults, and the user lookup
# that binds `worker` to the UID and GID the container runs as (entrypoint.sh).
SetEnv LANG=C.UTF-8 LD_PRELOAD=/usr/local/lib/libnss_wrapper.so NSS_WRAPPER_PASSWD=/tmp/accounts/passwd NSS_WRAPPER_GROUP=/tmp/accounts/group
