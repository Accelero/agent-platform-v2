name: Checks

# Every job is a selection of the one pytest suite (`pytest -m <expression>`);
# the same command runs the same tests locally. Every image is built once, by
# the `images` job; the jobs that need one test exactly that build, saved as an
# archive. Those jobs, the slowest, run on release tags and manual dispatch,
# not on pull requests. Pushes to main run no checks for now, so the image
# build cache, which only main writes, stays empty. On a release tag,
# `publish` pushes those tested images once every test job has passed.
'on':
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  # Runs every test job without a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: tooling, chart and hermes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m agent_platform.privacy
      - run: helm lint charts/agent-platform
      - name: Render manager deployment
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from agent_platform.release import ROOT, render_chart
          output = Path('.local/checks')
          output.mkdir(parents=True)
          render_chart(output, ROOT / "charts/agent-platform")
          PY
      - name: tooling, chart and hermes tests that need no image
        run: uv run pytest -v --tb=short -m '(tooling or chart or hermes) and not image' --junitxml=.local/reports/python.xml
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-report
          path: .local/reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  manager-gateway-dashboard-worker:
    name: manager, gateway, dashboard and worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Hosted runners have limited free disk. Incremental caches and full debug
      # info for every test profile filled it.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free runner disk before the Rust build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: services/hermes-manager/ui/.node-version
          cache: npm
          cache-dependency-path: services/hermes-manager/ui/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - run: uv sync --locked
      - name: cargo fmt
        working-directory: services/hermes-manager
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: services/hermes-manager
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install the dashboard dependencies
        working-directory: services/hermes-manager/ui
        run: npm ci --ignore-scripts
      - name: Install Chromium for the dashboard
        working-directory: services/hermes-manager/ui
        run: npx --no-install playwright install --with-deps chromium
      - name: manager, gateway, dashboard and worker tests
        run: uv run pytest -v --tb=short -m 'manager or gateway or dashboard or worker' --junitxml=.local/reports/services.xml
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: services-report
          path: .local/reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  images:
    name: build images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A cold build followed by the cache upload, for the two images in turn.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free runner disk for the image builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: provenance-add-gha=false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Expose the cache runtime to the build command
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing GitHub cache runtime variable: ${name}`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Build each image once
        run: uv run python -m tests.support.images --github-cache
      - name: Verify the manager image runs non-root with its production assets
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint sh hermes-manager:e2e -c \
            'test "$(id -u)" = 10001 && test -s /usr/share/hermes-manager/ui/index.html && test -x /usr/local/bin/hermes-manager && test -x /usr/local/bin/hermes-gateway && ! command -v node'
      - name: Save the images for the jobs that test them
        shell: bash
        run: |
          # The builder's own copy of the layers is no longer needed.
          docker buildx rm
          mkdir images
          docker save personal-hermes-native-test:local | zstd -T0 -3 -o images/personal-hermes-native-test_local.tar.zst
          docker save hermes-manager:e2e | zstd -T0 -3 -o images/hermes-manager_e2e.tar.zst
          docker save hermes-next-worker:test | zstd -T0 -3 -o images/hermes-next-worker_test.tar.zst
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: images
          path: images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  hermes-image:
    name: hermes image
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: images
          path: images
      - name: Load the image under test
        shell: bash
        run: zstd -dc images/personal-hermes-native-test_local.tar.zst | docker load
      - name: hermes image tests
        run: uv run pytest -v --tb=short -m 'hermes and image' --prebuilt --junitxml=.local/reports/hermes-image.xml
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hermes-image-report
          path: .local/reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: e2e part ${{ matrix.part }}
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # `--shard K/5` splits the e2e cases by file, balanced by
        # tests/e2e/durations.json; keep the count in step with the command.
        part: ['1', '2', '3', '4', '5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free runner disk for the clusters
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - run: uv sync --locked
      - name: Install Chromium and the certificate tool for the browser cases
        run: |
          sudo apt-get install --yes libnss3-tools
          uv run playwright install --with-deps chromium
      - name: Install the pinned k3d
        run: |
          curl -fsSL -o /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo '06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/k3d' | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: images
          path: images
      - name: e2e
        env:
          HERMES_TEST_K3D: /usr/local/bin/k3d
          HERMES_TEST_IMAGE_ARCHIVES: ${{ github.workspace }}/images
        run: uv run pytest -v --tb=short -m e2e --prebuilt --shard ${{ matrix.part }}/5 --junitxml=.local/reports/e2e-${{ matrix.part }}.xml
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-${{ matrix.part }}-report
          path: .local/reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # Runs only for a release tag, and only after every test job of the tag passed.
  # It publishes the images those jobs tested; nothing is rebuilt.
  publish:
    name: publish release
    needs: [python, manager-gateway-dashboard-worker, hermes-image, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    concurrency:
      group: agent-platform-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free runner disk for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - name: Validate sources and release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --locked
          uv run python -m agent_platform.privacy
          uv run python - <<'PY'
          import os
          from agent_platform.release import verify_release_source
          verify_release_source(os.environ['GITHUB_REF_NAME'].removeprefix('v'))
          PY
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new version.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: images
          path: images
      - name: Load the tested images
        shell: bash
        run: for archive in images/*.tar.zst; do zstd -dc "$archive" | docker load; done
      - name: Authenticate image publishing
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate chart publishing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested images and their chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m agent_platform.release
          --version "${GITHUB_REF_NAME#v}" --revision "$GITHUB_SHA" --publish
      - name: Upload chart package and informational receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-release
          path: |
            .local/releases/*/artifacts.json
            .local/releases/*/*.tgz
          if-no-files-found: error
          retention-days: 90
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Development builds are prereleases, never the latest release.
          PRERELEASE=()
          case "$VERSION" in *-dev.*) PRERELEASE=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag "${PRERELEASE[@]}" \
            --title "Agent platform v2 $VERSION" \
            --notes "Self-contained application chart with pinned runtime images. The same chart package is attached here and published to GHCR. artifacts.json is informational." \
            ".local/releases/$VERSION/artifacts.json" \
            ".local/releases/$VERSION/agent-platform-v2-$VERSION.tgz"
